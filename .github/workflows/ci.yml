name: CI

# Gate every push and PR: audit, lint, format, unit tests and a real build.
# This is the guard against the "fix one screen, silently break another"
# failure mode — nothing reaches main without all of them passing.
#
# Lint and formatting are separate gates on purpose: ESLint reports defects,
# Prettier reports style. A formatting nit must never surface as a lint error.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than `latest` so a bun release cannot change resolution or
      # audit behaviour out from under a green build.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # 24h supply-chain guard lives in bunfig.toml; a fresh lockfile install
      # fails loudly if a dependency was yanked or the lock is out of date.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies for known vulnerabilities
        run: bun audit --production

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Unit tests
        run: bun run test

      # Build executes the SSR/Nitro entry, which reads these at runtime. Placeholders
      # are enough — nothing here talks to Supabase; it only needs the vars to exist.
      - name: Build
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_placeholder
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
        run: bun run build
